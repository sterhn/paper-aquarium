<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аквариум</title>
<style>
  :root {
    --ink: #eaf6ff;
    --muted: #8aa6bd;
    --panel: rgba(8, 20, 34, 0.62);
    --line: rgba(140, 200, 255, 0.18);
    --accent: #58d6ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0e1013; overflow: hidden;
    color: var(--ink);
    font: 14px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; }

  .taphint {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    font: 14px/1.4 system-ui, sans-serif; color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 8px 20px; pointer-events: none; z-index: 5;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .taphint[hidden] { display: none; }

  /* ── menu ─────────────────────────────────────────────────────────────── */
  .menu {
    position: fixed; inset: 0; z-index: 15;
    display: grid; place-items: center; padding: 16px;
    background: rgba(2, 10, 18, 0.55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    animation: menu-fade 0.16s ease-out;
  }
  .menu[hidden] { display: none; }
  @keyframes menu-fade { from { opacity: 0 } to { opacity: 1 } }

  .menu .card {
    position: relative;
    width: min(420px, 100%); max-height: 100%; overflow: auto;
    background: rgba(6, 22, 38, 0.94);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 20px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    animation: menu-rise 0.18s ease-out;
  }
  @keyframes menu-rise { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }

  .menu h2 { margin: 0; font-size: 19px; font-weight: 600; padding-right: 40px; }
  .menu .who { margin: 4px 0 14px; font-size: 12px; color: var(--muted); }

  .menu .item {
    display: flex; align-items: center; gap: 12px;
    width: 100%; margin: 6px 0; padding: 12px 14px;
    font: inherit; text-decoration: none;
    color: var(--ink); background: rgba(88, 214, 255, 0.08);
    border: 1px solid var(--line); border-radius: 14px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .menu .item:hover { background: rgba(88, 214, 255, 0.18); border-color: rgba(140, 200, 255, 0.45); }
  .menu .item:active { transform: scale(0.98); }
  .menu .item.main { background: var(--accent); border-color: var(--accent); color: #04101c; }
  .menu .item.main:hover { background: #7ce0ff; }
  .menu .item .ico { font-size: 20px; flex: none; width: 28px; text-align: center; }
  .menu .item b { display: block; font-size: 14px; font-weight: 600; }
  .menu .item i { display: block; font-size: 12px; font-style: normal; opacity: 0.6; }

  .menu .x {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; line-height: 32px; text-align: center;
    font-size: 14px; border-radius: 50%;
    color: var(--muted); background: rgba(88, 214, 255, 0.08);
    border: 1px solid var(--line); cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .menu .x:hover { color: var(--ink); background: rgba(88, 214, 255, 0.2); border-color: rgba(140, 200, 255, 0.45); }

  /* ── background picker ──────────────────────────────────────────────── */
  .menu .goback {
    display: inline-block; margin: 0 0 10px; padding: 0;
    font: inherit; color: var(--muted); background: none; border: 0; cursor: pointer;
  }
  .menu .goback:hover { color: var(--accent); }

  .bggrid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin: 10px 0;
  }
  .bggrid button {
    position: relative; padding: 0; border: 2px solid var(--line); border-radius: 10px;
    overflow: hidden; cursor: pointer; background: #0a2233;
    aspect-ratio: 16 / 9;
    transition: border-color 0.15s, transform 0.1s;
  }
  .bggrid button:hover { border-color: var(--accent); }
  .bggrid button:active { transform: scale(0.97); }
  .bggrid button.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .bggrid button img {
    display: block; width: 100%; height: 100%; object-fit: cover;
  }

  .langrow {
    margin: 10px 0 0; text-align: center;
  }
  .langrow button {
    font: 12px/1 system-ui, sans-serif; padding: 4px 10px;
    border: 1px solid transparent; border-radius: 8px;
    background: transparent; color: var(--muted); cursor: pointer;
    transition: color .15s, background .15s, border-color .15s;
  }
  .langrow button:hover { color: var(--ink); }
  .langrow button.active {
    color: var(--accent); border-color: var(--line); background: rgba(88, 214, 255, 0.1);
  }
</style>
</head>
<body>

<div class="taphint" id="taphint" hidden></div>

<div class="menu" id="menu" hidden>
  <div class="card" id="menu-card">
    <button class="x" id="m-close" type="button">&#x2715;</button>

    <div id="menu-main">
      <h2 id="m-name"></h2>
      <p class="who"><span id="m-count"></span></p>

      <button class="item main" id="m-add" type="button">
        <span class="ico">🤖</span>
        <span><b id="t-add-title"></b><i id="t-add-sub"></i></span>
      </button>
      <button class="item" id="m-feed" type="button">
        <span class="ico">&#x26A1;</span>
        <span><b id="t-feed-title"></b><i id="t-feed-sub"></i></span>
      </button>
      <button class="item" id="m-bg" type="button">
        <span class="ico">&#x1F5BC;&#xFE0F;</span>
        <span><b id="t-bg-title"></b><i id="t-bg-sub"></i></span>
      </button>

      <div class="langrow" id="langrow"></div>
    </div>

    <div id="menu-bgpick" hidden>
      <button class="goback" id="m-bgback" type="button"></button>
      <h2 id="t-bg-heading"></h2>
      <div class="bggrid" id="bggrid"></div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/RoomEnvironment.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/DRACOLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<script src="assets/fish-frame.js"></script>
<script>
(function () {
  'use strict';

  // ── i18n ──────────────────────────────────────────────────────────────
  var LANGS = ['ru', 'en', 'pl'];
  var DICT = {
    ru: {
      title: 'Аквариум',
      hint: 'нажми в любом месте',
      count0: 'роботов пока нет',
      count: function (n) {
        var m = n % 10, h = n % 100;
        var w = (m === 1 && h !== 11) ? 'робот' : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? 'робота' : 'роботов';
        return n + ' ' + w;
      },
      add: 'Запустить робота', addSub: 'из набора, без раскрашивания',
      feed: 'Подзарядить', feedSub: 'роботы соберутся на подзарядку',
      bg: 'Сменить фон', bgSub: 'картинка, на фоне которой двигаются роботы',
      bgTitle: 'Выбери фон', back: '← назад'
    },
    en: {
      title: 'Aquarium',
      hint: 'tap anywhere',
      count0: 'no robots yet',
      count: function (n) { return n + ' robot' + (n !== 1 ? 's' : ''); },
      add: 'Add a robot', addSub: 'from the collection, with default skin',
      feed: 'Recharge', feedSub: 'robots gather for a charge-up',
      bg: 'Change background', bgSub: 'the image behind the robots',
      bgTitle: 'Pick a background', back: '← back'
    },
    pl: {
      title: 'Akwarium',
      hint: 'dotkij dowolne miejsce',
      count0: 'jeszcze nie ma robotów',
      count: function (n) {
        var m = n % 10, h = n % 100;
        var w = (n === 1) ? 'robot' : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? 'roboty' : 'robotów';
        return n + ' ' + w;
      },
      add: 'Dodaj robota', addSub: 'z kolekcji, bez malowania',
      feed: 'Naładuj', feedSub: 'roboty zbiorą się na ładowanie',
      bg: 'Zmień tło', bgSub: 'obrazek za robotami',
      bgTitle: 'Wybierz tło', back: '← wstecz'
    }
  };
  var lang = 'ru';
  try { var s = localStorage.getItem('aqua.lang'); if (s && DICT[s]) lang = s; } catch (e) {}
  if (!DICT[lang]) {
    var bl = (navigator.language || '').slice(0, 2).toLowerCase();
    if (DICT[bl]) lang = bl;
  }
  function t(key) { return DICT[lang][key] || DICT.ru[key] || key; }

  function applyLang() {
    document.getElementById('m-name').textContent = t('title');
    document.getElementById('t-add-title').textContent = t('add');
    document.getElementById('t-add-sub').textContent = t('addSub');
    document.getElementById('t-feed-title').textContent = t('feed');
    document.getElementById('t-feed-sub').textContent = t('feedSub');
    document.getElementById('t-bg-title').textContent = t('bg');
    document.getElementById('t-bg-sub').textContent = t('bgSub');
    document.getElementById('t-bg-heading').textContent = t('bgTitle');
    document.getElementById('m-bgback').textContent = t('back');
    document.getElementById('taphint').textContent = t('hint');
    document.title = t('title');
    updateCount();
  }

  function mountLang() {
    var row = document.getElementById('langrow');
    LANGS.forEach(function (code) {
      var btn = document.createElement('button');
      btn.textContent = code.toUpperCase();
      btn.type = 'button';
      if (code === lang) btn.className = 'active';
      btn.onclick = function () {
        lang = code;
        try { localStorage.setItem('aqua.lang', code); } catch (e) {}
        row.querySelectorAll('button').forEach(function (b) { b.className = ''; });
        btn.className = 'active';
        applyLang();
      };
      row.appendChild(btn);
    });
  }

  // ── scene constants ───────────────────────────────────────────────────
  var MODEL_URL = 'assets/models/pack/spherebot/spherebot.glb';
  var MAX_ROBOTS = 20;

  var BACKGROUNDS = [
    'assets/backgrounds/webp/01-0.webp',
    'assets/backgrounds/webp/01-1.webp',
    'assets/backgrounds/webp/02-0.webp',
    'assets/backgrounds/webp/02-1.webp',
    'assets/backgrounds/webp/03-0.webp',
    'assets/backgrounds/webp/03-1.webp',
    'assets/backgrounds/webp/04-0.webp',
    'assets/backgrounds/webp/05-0.webp',
    'assets/backgrounds/webp/05-1.webp'
  ];

  var Z_NEAR = 6, Z_FAR = -18, FLOOR = 0, LIT_DEPTH = 12.4;
  var MARGIN = 1.6, FLOOR_ROOM = 0.9;
  var CAM_POS = [0, 6.5, 17.5], CAM_TARGET = [0, 6.5, 0];
  var FOV = 42;
  var TAN_HALF_FOV = Math.tan(FOV / 2 * Math.PI / 180);
  var BEATS_PER_LENGTH = 0.85;

  var renderer, scene, camera, clock;
  var fishes = [];
  var foods = [], foodGeo, foodMat;
  var uTime = { value: 0 };
  var caustics = { value: 1 };
  var baseGLTF = null;
  var baseInfo = null;
  var currentBg = 0;

  var FOOD_MAX = 220;
  var FOOD_REACH = 0.9;
  var FOOD_FADE = 3.5;
  var EAT_REACH = 0.8;

  function limitsAt(z) {
    var d = CAM_POS[2] - z;
    var half = d * TAN_HALF_FOV;
    var aspect = camera ? camera.aspect : innerWidth / innerHeight;
    var yc = CAM_TARGET[1];
    return {
      hw: half * aspect + MARGIN,
      yTop: yc + half + MARGIN,
      yBot: Math.max(FLOOR + FLOOR_ROOM, yc - half - MARGIN)
    };
  }

  function frameAt(z) {
    var d = CAM_POS[2] - z;
    var half = d * TAN_HALF_FOV;
    var aspect = camera ? camera.aspect : innerWidth / innerHeight;
    var yc = CAM_TARGET[1];
    return { hw: half * aspect, yTop: yc + half, yBot: Math.max(FLOOR + FLOOR_ROOM, yc - half) };
  }

  // ── caustic shader ──────────────────────────────────────────────────────
  var CAUSTIC_GLSL = [
    'float causticPattern(vec2 p, float t) {',
    '  vec2 q = p * 0.55;',
    '  float c = 0.0;',
    '  for (int i = 0; i < 3; i++) {',
    '    float fi = float(i) + 1.0;',
    '    q += 0.42 * vec2(sin(q.y * 1.35 + t * 1.05 * fi), cos(q.x * 1.6 + t * 0.9 * fi));',
    '    c += 0.32 / (abs(sin(q.x) * sin(q.y)) * 3.3 + 0.32);',
    '  }',
    '  return pow(clamp(c * 0.16, 0.0, 1.0), 2.5);',
    '}'
  ].join('\n');

  function addCaustics(mat, strength) {
    mat.onBeforeCompile = function (shader) {
      shader.uniforms.uTime = uTime;
      shader.uniforms.uCaustics = caustics;
      shader.vertexShader = 'varying vec3 vWPos;\n' + shader.vertexShader.replace(
        '#include <begin_vertex>',
        '#include <begin_vertex>\n  vWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;'
      );
      shader.fragmentShader = 'varying vec3 vWPos;\nuniform float uTime;\nuniform float uCaustics;\n' +
        CAUSTIC_GLSL + '\n' + shader.fragmentShader.replace(
          '#include <map_fragment>',
          [
            '#include <map_fragment>',
            'float caus = causticPattern(vWPos.xz, uTime * 0.35);',
            'float depthFade = 1.0 - clamp(vWPos.y / ' + LIT_DEPTH.toFixed(1) + ', 0.0, 1.0) * 0.65;',
            'diffuseColor.rgb += vec3(0.45, 0.72, 0.85) * caus * ' + strength.toFixed(2) + ' * uCaustics * depthFade;'
          ].join('\n')
        );
    };
    mat.customProgramCacheKey = function () { return 'caustic' + strength; };
    return mat;
  }

  // ── orientation ─────────────────────────────────────────────────────────
  function axisVec(name, sign) {
    return new THREE.Vector3(name === 'x' ? sign : 0, name === 'y' ? sign : 0, name === 'z' ? sign : 0);
  }
  function maskVec(name) { return axisVec(name, 1); }

  function fishFrame(root, useWorld, axes) {
    var box = new THREE.Box3(), sum = new THREE.Vector3(), v = new THREE.Vector3(), n = 0;
    root.traverse(function (o) {
      if (!o.isMesh) return;
      var p = o.geometry.attributes.position;
      for (var i = 0; i < p.count; i++) {
        v.fromBufferAttribute(p, i);
        if (useWorld) v.applyMatrix4(o.matrixWorld);
        box.expandByPoint(v); sum.add(v); n++;
      }
    });
    var size = box.getSize(new THREE.Vector3());
    var center = box.getCenter(new THREE.Vector3());
    var centroid = sum.divideScalar(Math.max(n, 1));
    var order = [['x', size.x], ['y', size.y], ['z', size.z]].sort(function (a, b) { return b[1] - a[1]; });
    var body = order[0][0], up = order[1][0], lat = order[2][0];
    if (axes) { body = axes.body; up = axes.up; lat = axes.lat; }
    var span = size[body] || 1;
    var thickLow = 0, thickHigh = 0;
    root.traverse(function (o) {
      if (!o.isMesh) return;
      var p = o.geometry.attributes.position;
      for (var i = 0; i < p.count; i++) {
        v.fromBufferAttribute(p, i);
        if (useWorld) v.applyMatrix4(o.matrixWorld);
        var tt = (v[body] - box.min[body]) / span;
        var lateral = Math.abs(v[lat] - center[lat]);
        if (tt < 0.18) thickLow = Math.max(thickLow, lateral);
        else if (tt > 0.82) thickHigh = Math.max(thickHigh, lateral);
      }
    });
    return {
      box: box, size: size, center: center,
      body: body, up: up, lat: lat,
      headAtMax: thickHigh > thickLow,
      dorsalPositive: FishFrame.dorsalPositive(up, centroid, center)
    };
  }

  function normalizeFish(root, targetLen, skel) {
    root.updateWorldMatrix(true, true);
    var axes = skel && skel.axes;
    var w = fishFrame(root, true, axes);
    var local = fishFrame(root, false, axes);
    if (skel && typeof skel.headAtMax === 'boolean') {
      w.headAtMax = skel.headAtMax; local.headAtMax = skel.headAtMax;
    }
    var forward = axisVec(w.body, w.headAtMax ? 1 : -1);
    var upVec = axisVec(w.up, w.dorsalPositive ? 1 : -1);
    var right = new THREE.Vector3().crossVectors(upVec, forward);
    var basis = new THREE.Matrix4().makeBasis(right, upVec, forward);
    var quat = new THREE.Quaternion().setFromRotationMatrix(basis).invert();
    root.position.sub(w.center);
    return {
      quat: quat, scale: targetLen / (w.size[w.body] || 1),
      bodyMask: maskVec(local.body), latMask: maskVec(local.lat),
      range: [local.box.min[local.body], local.box.max[local.body]],
      headAtMax: local.headAtMax
    };
  }

  // ── strip root motion ───────────────────────────────────────────────────
  function stripRootMotion(clip, modelSize) {
    var dominated = [];
    clip.tracks.forEach(function (tr) {
      if (!(tr instanceof THREE.VectorKeyframeTrack)) return;
      var v = tr.values, n = v.length / 3;
      var lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
      for (var i = 0; i < n; i++) for (var c = 0; c < 3; c++) {
        if (v[i * 3 + c] < lo[c]) lo[c] = v[i * 3 + c];
        if (v[i * 3 + c] > hi[c]) hi[c] = v[i * 3 + c];
      }
      var move = Math.sqrt(
        Math.pow(hi[0] - lo[0], 2) + Math.pow(hi[1] - lo[1], 2) + Math.pow(hi[2] - lo[2], 2));
      if (move > modelSize * 0.3) dominated.push(tr);
    });
    dominated.forEach(function (tr) {
      var idx = clip.tracks.indexOf(tr);
      if (idx !== -1) clip.tracks.splice(idx, 1);
    });
  }

  // ── beat detection ──────────────────────────────────────────────────────
  var FIN_BONE = /fin|pect|dors|anal|pelv|tip/i;
  function clipBeatHz(clip) {
    var best = 0, bestSpan = 0;
    for (var ti = 0; ti < clip.tracks.length; ti++) {
      var tr = clip.tracks[ti];
      if (!(tr instanceof THREE.QuaternionKeyframeTrack)) continue;
      if (FIN_BONE.test(tr.name)) continue;
      var v = tr.values, n = v.length / 4;
      if (n < 4) continue;
      for (var c = 0; c < 3; c++) {
        var min = Infinity, max = -Infinity, sum = 0;
        for (var i = 0; i < n; i++) {
          var x = v[i * 4 + c];
          if (x < min) min = x; if (x > max) max = x; sum += x;
        }
        var span = max - min;
        if (span <= bestSpan) continue;
        var mean = sum / n, cross = 0;
        for (var j = 1; j < n; j++) {
          if ((v[(j - 1) * 4 + c] - mean) * (v[j * 4 + c] - mean) < 0) cross++;
        }
        var dur = tr.times[tr.times.length - 1] || 1;
        bestSpan = span; best = cross / 2 / dur;
      }
    }
    return best > 0.05 ? best : 0;
  }

  // ── bend shader ─────────────────────────────────────────────────────────
  function addBend(mat, info, amp, phase) {
    var uniforms = {
      uTime: uTime, uAmp: { value: amp }, uPhase: { value: phase },
      uBodyMask: { value: info.bodyMask }, uLatMask: { value: info.latMask },
      uRange: { value: new THREE.Vector2(info.range[0], info.range[1]) },
      uHeadAtMax: { value: info.headAtMax ? 1 : 0 }
    };
    var prev = mat.onBeforeCompile;
    mat.onBeforeCompile = function (shader) {
      if (prev) prev.call(this, shader);
      Object.keys(uniforms).forEach(function (k) { shader.uniforms[k] = uniforms[k]; });
      shader.vertexShader =
        'uniform float uTime; uniform float uAmp; uniform float uPhase;\n' +
        'uniform vec3 uBodyMask; uniform vec3 uLatMask;\n' +
        'uniform vec2 uRange; uniform float uHeadAtMax;\n' +
        shader.vertexShader.replace('#include <begin_vertex>', [
          '#include <begin_vertex>',
          'float a = dot(transformed, uBodyMask);',
          'float span = max(uRange.y - uRange.x, 0.0001);',
          'float k = uHeadAtMax > 0.5 ? (uRange.y - a) / span : (a - uRange.x) / span;',
          'k = clamp(k, 0.0, 1.0); k *= k;',
          'float w = sin(uTime * 5.5 + uPhase + k * 3.2) * uAmp * k * span * 0.25;',
          'transformed += uLatMask * w;'
        ].join('\n'));
    };
    mat.customProgramCacheKey = function () { return prev ? 'paint+bend' : 'bend'; };
  }

  // ── spawn ───────────────────────────────────────────────────────────────
  function spawnFromModel(gltf, info) {
    var clone = THREE.SkeletonUtils.clone(gltf.scene);
    var pivot = new THREE.Group();
    pivot.quaternion.copy(info.quat);
    pivot.scale.setScalar(info.scale);
    pivot.add(clone);
    var mixer = null, beatHz = 0;
    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(clone);
      var clip = gltf.animations[0];
      beatHz = clipBeatHz(clip);
      var act = mixer.clipAction(clip);
      act.time = Math.random() * 2;
      act.play();
    }
    var phase = Math.random() * 6.28;
    clone.traverse(function (o) {
      if (!o.isMesh) return;
      o.material = addCaustics(o.material.clone(), 0.5);
      o.material.envMapIntensity = 0.5;
      var bend = beatHz ? 0 : 0.35;
      if (bend > 0) addBend(o.material, info, bend, phase);
    });
    var group = new THREE.Group();
    group.add(pivot);
    return { group: group, mixer: mixer, phase: phase, beatHz: beatHz };
  }

  // ── Fish class ──────────────────────────────────────────────────────────
  function Fish(gltf, info, len) {
    var built = spawnFromModel(gltf, info);
    this.mesh = built.group;
    this.mixer = built.mixer;
    this.beatHz = built.beatHz;
    this.len = len;
    this.radius = len * 0.5;
    this.speed = 1.2 + Math.random() * 0.6;
    this.phase = built.phase;
    this.noticeFood = 5 + Math.random() * 8;
    this.fullUntil = 0;

    var z0 = Z_FAR + Math.random() * (Z_NEAR - Z_FAR);
    var l0 = limitsAt(z0);
    var inX = Math.max(0.5, l0.hw - MARGIN);
    var inLo = l0.yBot + MARGIN, inHi = l0.yTop - MARGIN;
    this.pos = new THREE.Vector3(
      (Math.random() * 2 - 1) * inX,
      inLo + Math.random() * Math.max(0.5, inHi - inLo),
      z0
    );
    this.vel = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize().multiplyScalar(this.speed);
    scene.add(this.mesh);
  }

  var _a = new THREE.Vector3(), _l = new THREE.Vector3(), _d = new THREE.Vector3();
  Fish.prototype.update = function (dt, t) {
    _a.set(
      Math.sin(t * 0.42 + this.phase) * 0.5,
      Math.sin(t * 0.3 + this.phase * 1.6) * 0.22,
      Math.cos(t * 0.37 + this.phase) * 0.5
    );

    if (foods.length && t > this.fullUntil) {
      var best = -1, bestD = 1e9;
      for (var fi = 0; fi < foods.length; fi++) {
        var fd = this.pos.distanceTo(foods[fi].mesh.position);
        if (fd < bestD) { bestD = fd; best = fi; }
      }
      if (best >= 0 && bestD < this.noticeFood) {
        if (bestD < EAT_REACH) {
          eatNear(this.pos, 1 + Math.floor(Math.random() * 3));
          this.fullUntil = t + 2.5 + Math.random() * 8;
        } else {
          _d.copy(foods[best].mesh.position).sub(this.pos).normalize();
          _a.addScaledVector(_d, bestD < 6 ? 4.5 : 2.2);
        }
      }
    }

    var M = MARGIN, W = 5;
    if (this.pos.z > Z_NEAR - M) _a.z -= W;
    if (this.pos.z < Z_FAR + M) _a.z += W;
    var lim = limitsAt(this.pos.z);
    if (this.pos.x > lim.hw - M) _a.x -= W;
    if (this.pos.x < -lim.hw + M) _a.x += W;
    if (this.pos.y > lim.yTop - M) _a.y -= W;
    if (this.pos.y < lim.yBot + M) _a.y += W;
    var floor = FLOOR + FLOOR_ROOM;
    if (this.pos.y < floor) _a.y += (floor - this.pos.y) * 4;

    this.vel.addScaledVector(_a, dt * 2.0);
    var sp = this.vel.length();
    if (sp > this.speed) this.vel.multiplyScalar(this.speed / sp);
    if (sp < this.speed * 0.35) this.vel.multiplyScalar(1.05);

    this.pos.addScaledVector(this.vel, dt);
    this.mesh.position.copy(this.pos);
    this.mesh.lookAt(_l.copy(this.pos).add(this.vel));
    this.mesh.rotation.z += Math.sin(t * 2.5 + this.phase) * 0.015;

    if (this.mixer) {
      var scale;
      if (this.beatHz) {
        var want = BEATS_PER_LENGTH * this.vel.length() / this.len;
        scale = want / this.beatHz;
      } else {
        scale = 0.6 + this.vel.length() / this.speed * 0.6;
      }
      this.mixer.update(dt * Math.max(0.25, Math.min(2, scale)));
    }
  };

  // ── food ────────────────────────────────────────────────────────────────
  function eatNear(pos, max) {
    var ate = 0;
    for (var i = foods.length - 1; i >= 0 && ate < max; i--) {
      if (pos.distanceTo(foods[i].mesh.position) < EAT_REACH) {
        eatFood(i); ate++;
      }
    }
  }

  function eatFood(i) {
    scene.remove(foods[i].mesh);
    foods.splice(i, 1);
  }

  function feedNow() {
    if (!foodGeo) {
      foodGeo = new THREE.SphereGeometry(0.09, 8, 6);
      foodMat = new THREE.MeshStandardMaterial({
        color: 0xd2913f, roughness: 0.9, emissive: 0x63421a, emissiveIntensity: 0.6
      });
    }
    var tight = Math.random();
    var spreadX = 0.7 + (1 - tight) * 5.0;
    var spreadZ = 0.5 + (1 - tight) * 2.4;
    var count = Math.round(7 + (1 - tight) * 26 + Math.random() * 10);
    count = Math.min(count, Math.max(0, FOOD_MAX - foods.length));

    var cz = Z_NEAR - 3 - Math.random() * ((Z_NEAR - Z_FAR) * 0.45);
    var cl = frameAt(cz);
    var cx = (Math.random() * 2 - 1) * Math.max(1, cl.hw - spreadX - 1);

    for (var i = 0; i < count; i++) {
      var m = new THREE.Mesh(foodGeo, foodMat);
      m.position.set(
        cx + (Math.random() - 0.5) * spreadX * 2,
        cl.yTop - 0.3 - Math.random() * (0.6 + (1 - tight) * 2.5),
        cz + (Math.random() - 0.5) * spreadZ * 2
      );
      scene.add(m);
      foods.push({ mesh: m, seed: Math.random() * 6.28, sink: 0.28 + Math.random() * 0.22, gone: 0 });
    }
  }

  function updateFoods(dt, t) {
    for (var i = foods.length - 1; i >= 0; i--) {
      var f = foods[i], p = f.mesh.position;
      p.y -= f.sink * dt;
      p.x += Math.sin(t * 1.7 + f.seed) * dt * 0.12;
      p.z += Math.cos(t * 1.3 + f.seed) * dt * 0.09;
      if (p.y < limitsAt(p.z).yBot + FOOD_REACH) {
        f.gone += dt;
        var k = 1 - f.gone / FOOD_FADE;
        if (k <= 0.02) { eatFood(i); continue; }
        f.mesh.scale.setScalar(k);
      }
      if (p.y < FLOOR + 0.12) p.y = FLOOR + 0.12;
    }
  }

  // ── background ──────────────────────────────────────────────────────────
  function fitBackground() {
    var tex = scene.background;
    if (!tex || !tex.isTexture || !tex.image || !tex.image.width) return;
    var screenAspect = innerWidth / innerHeight;
    var imageAspect = tex.image.width / tex.image.height;
    if (screenAspect > imageAspect) {
      var ry = imageAspect / screenAspect;
      tex.repeat.set(1, ry);
      tex.offset.set(0, (1 - ry) / 2);
    } else {
      var rx = screenAspect / imageAspect;
      tex.repeat.set(rx, 1);
      tex.offset.set((1 - rx) / 2, 0);
    }
  }

  function applyBackground(url) {
    if (!url) {
      scene.background = new THREE.Color(0x0e1013);
      return;
    }
    new THREE.TextureLoader().load(url, function (tex) {
      tex.encoding = THREE.sRGBEncoding;
      scene.background = tex;
      fitBackground();
    });
  }

  // ── scene ───────────────────────────────────────────────────────────────
  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.92;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1013);
    scene.fog = new THREE.Fog(0x2e86a8, 14, 60);

    camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.1, 300);
    camera.position.fromArray(CAM_POS);
    camera.lookAt(new THREE.Vector3().fromArray(CAM_TARGET));

    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var envRT = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04);
    scene.environment = envRT.texture;

    scene.add(new THREE.AmbientLight(0x223444, 0.16));
    var spot = new THREE.SpotLight(0xe8f7ff, 3.4, 48, 0.62, 0.42, 1.1);
    spot.position.set(0, 15.2, -1.5);
    spot.target.position.set(0, 0, 0);
    scene.add(spot, spot.target);
    var fill = new THREE.DirectionalLight(0x9fc9e0, 0.35);
    fill.position.set(12, 8, 20);
    scene.add(fill);

    applyBackground(BACKGROUNDS[currentBg]);

    clock = new THREE.Clock();
    addEventListener('resize', onResize);

    loadModel();
    animate();
  }

  function loadModel() {
    var loader = new THREE.GLTFLoader();
    if (THREE.DRACOLoader) {
      var draco = new THREE.DRACOLoader();
      draco.setDecoderPath('vendor/draco/');
      loader.setDRACOLoader(draco);
    }
    loader.load(MODEL_URL, function (gltf) {
      var skel = FishFrame.fromSkeleton(gltf);
      var info = normalizeFish(gltf.scene, 1.8, skel);
      var b = FishFrame.bounds(gltf.scene);
      (gltf.animations || []).forEach(function (clip) {
        stripRootMotion(clip, Math.max(b.size.x, b.size.y, b.size.z));
      });
      baseGLTF = gltf;
      baseInfo = info;
      for (var i = 0; i < 3; i++) addRobot();
      updateCount();

      document.getElementById('taphint').hidden = false;
    });
  }

  function addRobot() {
    if (!baseGLTF || fishes.length >= MAX_ROBOTS) return;
    fishes.push(new Fish(baseGLTF, baseInfo, 1.8));
  }

  function updateCount() {
    var n = fishes.length;
    document.getElementById('m-count').textContent = n ? t('count')(n) : t('count0');
  }

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var ti = clock.elapsedTime;
    uTime.value = ti;
    for (var i = 0; i < fishes.length; i++) fishes[i].update(dt, ti);
    updateFoods(dt, ti);
    renderer.render(scene, camera);
  }

  function onResize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    fitBackground();
  }

  // ── menu ────────────────────────────────────────────────────────────────
  var menu = document.getElementById('menu');
  var menuCard = document.getElementById('menu-card');
  var menuMain = document.getElementById('menu-main');
  var menuBgPick = document.getElementById('menu-bgpick');
  var taphint = document.getElementById('taphint');
  var menuUsed = false;

  function showMenu() {
    menu.hidden = false;
    taphint.hidden = true;
    updateCount();
  }
  function hideMenu() {
    showMainView();
    menu.hidden = true;
    if (!menuUsed) taphint.hidden = false;
  }
  function toggleMenu() {
    menuUsed = true;
    if (menu.hidden) showMenu(); else hideMenu();
  }

  function showMainView() {
    menuMain.hidden = false;
    menuBgPick.hidden = true;
  }

  document.addEventListener('click', function (e) {
    if (menuCard.contains(e.target)) return;
    toggleMenu();
  });
  addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !menu.hidden) hideMenu();
  });

  document.getElementById('m-close').onclick = function (e) {
    e.stopPropagation();
    hideMenu();
  };

  document.getElementById('m-add').onclick = function (e) {
    e.stopPropagation();
    if (fishes.length >= MAX_ROBOTS) return;
    addRobot();
    updateCount();
    hideMenu();
  };

  document.getElementById('m-feed').onclick = function (e) {
    e.stopPropagation();
    hideMenu();
    feedNow();
  };

  // ── background picker ──────────────────────────────────────────────────
  document.getElementById('m-bg').onclick = function (e) {
    e.stopPropagation();
    menuMain.hidden = true;
    menuBgPick.hidden = false;
    buildBgGrid();
  };
  document.getElementById('m-bgback').onclick = function (e) {
    e.stopPropagation();
    showMainView();
  };

  var bgGridBuilt = false;
  function buildBgGrid() {
    if (bgGridBuilt) return;
    bgGridBuilt = true;
    var grid = document.getElementById('bggrid');
    BACKGROUNDS.forEach(function (url, idx) {
      var btn = document.createElement('button');
      btn.type = 'button';
      if (idx === currentBg) btn.className = 'active';
      var img = document.createElement('img');
      img.src = url;
      img.alt = '';
      img.loading = 'lazy';
      btn.appendChild(img);
      btn.onclick = function (e) {
        e.stopPropagation();
        currentBg = idx;
        applyBackground(url);
        grid.querySelectorAll('button').forEach(function (b) { b.className = ''; });
        btn.className = 'active';
      };
      grid.appendChild(btn);
    });
  }

  // ── init ────────────────────────────────────────────────────────────────
  mountLang();
  applyLang();
  init();
})();
</script>
</body>
</html>
