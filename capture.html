<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#04101c">
<title data-t="cap.title">Оживи свою рыбку!</title>
<style>
  :root {
    --ink: #eaf6ff;
    --muted: #8aa6bd;
    --accent: #58d6ff;
    --ok: #4ade80;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(180deg, #06263f 0%, #04101c 100%);
    color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 18px 40px;
    text-align: center;
  }
  h1 { font-size: 26px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 26px; }

  /* Внутри меню аквариума страница живёт как врезка: своя подложка и своя
     ссылка «назад» там лишние — их даёт карточка меню. */
  body.embed { background: none; padding: 4px 14px 20px; }
  body.embed h1 { font-size: 20px; }
  body.embed .back { display: none; }

  /* Съёмка — тупиковый экран: без этой ссылки вернуться к аквариуму
     можно только кнопкой «назад» в браузере. */
  .back {
    position: fixed; top: 12px; left: 12px; z-index: 5;
    color: var(--muted); text-decoration: none; font-size: 13px;
    background: rgba(4, 16, 28, 0.72); border: 1px solid rgba(140, 200, 255, 0.18);
    border-radius: 999px; padding: 8px 14px;
  }
  .back:active { color: var(--ink); }

  .screen { display: none; width: 100%; max-width: 440px; }
  .screen.on { display: block; }

  .big {
    display: block; width: 100%;
    font: inherit; font-size: 19px; font-weight: 600;
    color: #04101c; background: var(--accent);
    border: 0; border-radius: 18px;
    padding: 18px 20px; margin: 14px 0 0;
    cursor: pointer;
  }
  .big:active { transform: translateY(1px); filter: brightness(1.1); }
  .big.green { background: var(--ok); }
  .big.ghost {
    background: transparent; color: var(--muted);
    border: 1.5px solid rgba(140, 200, 255, 0.3);
    font-weight: 500;
  }
  input[type=file] { display: none; }

  .bubble { font-size: 64px; margin: 10px 0; }
  .fishname { font-size: 20px; font-weight: 600; margin: 14px 0 2px; }

  .preview {
    width: 100%; border-radius: 16px; margin-top: 10px;
    border: 1px solid rgba(140, 200, 255, 0.25);
    background: #0a2233;
  }
  .stage3d {
    width: 100%; aspect-ratio: 4 / 3; margin-top: 10px;
    border-radius: 16px; overflow: hidden; position: relative;
    border: 1px solid rgba(140, 200, 255, 0.25);
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(88, 214, 255, 0.25) 0%, transparent 55%),
      linear-gradient(180deg, #0d4a6b 0%, #04101c 100%);
  }
  .stage3d canvas { display: block; width: 100%; height: 100%; }
  .stage3d .spin3d {
    position: absolute; inset: 0; display: grid; place-content: center;
    color: var(--muted); font-size: 13px;
  }

  /* «Ярче цвета»: светлый карандаш подкручивается прямо на превью,
     до выпуска. Ползунок — единственная ручка, детям хватает одной. */
  .boostrow {
    display: flex; align-items: center; gap: 12px;
    margin: 14px 2px 0; text-align: left;
  }
  .boostrow label { flex: none; color: var(--muted); font-size: 14px; }
  .boostrow input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }

  .spin {
    width: 44px; height: 44px; margin: 30px auto 12px;
    border: 4px solid rgba(140, 200, 255, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .err {
    background: rgba(255, 100, 100, 0.12);
    border: 1px solid rgba(255, 120, 120, 0.4);
    border-radius: 14px; padding: 14px 16px;
    color: #ffc9c9; font-size: 14px; margin-top: 16px;
    text-align: left;
  }
  .hintline { color: var(--muted); font-size: 13px; margin-top: 22px; }

  /* ── рисование ─────────────────────────────────────────────────────────── */
  .draw-wrap {
    width: 100%; max-width: 300px; margin: 6px auto 0;
    border-radius: 12px; overflow: hidden;
    border: 1px solid rgba(140, 200, 255, 0.25);
    background: #0a2233;
  }
  #draw-canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: crosshair; }
  .drawhint { margin-bottom: 4px; }
  .drawbtns { display: flex; gap: 8px; justify-content: center; margin: 10px 2px 0; }
  .palette {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    margin: 12px 0 0; padding: 0 4px;
  }
  .swatch {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2); cursor: pointer; flex: none;
    padding: 0; appearance: none;
  }
  .swatch.active { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
  .drawrow {
    display: flex; align-items: center; gap: 10px; margin: 10px 2px 0;
  }
  .drawrow label { font-size: 13px; color: var(--muted); flex: none; }
  .drawrow input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .icon-btn {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(140,200,255,0.25);
    border-radius: 8px; color: var(--ink); font-size: 13px;
    padding: 6px 10px; cursor: pointer; flex: none;
  }
  .icon-btn.active { background: rgba(88,214,255,0.18); border-color: var(--accent); }

  /* Мост на телефон для больших экранов: выбор файла на компьютере — тупик,
     а камера всегда в кармане. Белая подложка обязательна: без неё сканер
     не видит код на тёмном. */
  .qrrow {
    display: flex; align-items: center; gap: 14px; text-align: left;
    margin: 26px auto 0; max-width: 400px;
    border-top: 1px solid rgba(140, 200, 255, 0.18); padding-top: 20px;
  }
  .qrrow .qrbox {
    flex: none; line-height: 0;
    background: #fff; border-radius: 10px; padding: 7px;
  }
  .qrrow .qrbox svg { display: block; width: 96px; height: 96px; }
  .qrrow .qrtext { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<a class="back" id="back" data-t="cap.back"></a>

<h1 data-t="cap.title"></h1>
<p class="sub" data-t="cap.sub"></p>

<!-- старт -->
<div class="screen on" id="s-start">
  <div class="bubble">📷</div>
  <label class="big" for="file" data-t="cap.shoot"></label>
  <input type="file" id="file" accept="image/*" capture="environment">
  <p class="hintline" data-t="cap.hint"></p>
  <button class="big ghost" id="b-draw" data-t="cap.draw"></button>
  <div class="qrrow" id="qrrow" hidden>
    <span class="qrbox" id="cap-qr"></span>
    <span class="qrtext" data-t="cap.qr"></span>
  </div>
</div>

<!-- рисование -->
<div class="screen" id="s-draw">
  <p class="fishname" id="draw-name"></p>
  <p class="sub drawhint" data-t="cap.draw.hint"></p>
  <div class="draw-wrap"><canvas id="draw-canvas"></canvas></div>
  <div class="palette" id="palette"></div>
  <div class="drawrow">
    <label for="brush-size" data-t="cap.draw.size"></label>
    <input type="range" id="brush-size" min="4" max="64" value="18">
  </div>
  <div class="drawbtns">
    <button class="icon-btn" id="fill-btn" data-t="cap.draw.fill"></button>
    <button class="icon-btn" id="erase-btn" data-t="cap.draw.erase"></button>
    <button class="icon-btn" id="clear-btn" data-t="cap.draw.clear"></button>
  </div>
  <button class="big green" id="b-draw-done" data-t="cap.draw.done"></button>
  <button class="big ghost" id="b-draw-back" data-t="cap.draw.back"></button>
</div>

<!-- обработка -->
<div class="screen" id="s-busy">
  <div class="spin"></div>
  <p id="busy-text" data-t="cap.searching"></p>
</div>

<!-- превью -->
<div class="screen" id="s-preview">
  <p class="fishname" id="p-name"></p>
  <div class="stage3d" id="stage3d"><div class="spin3d" id="spin3d" data-t="cap.reviving"></div></div>
  <img class="preview" id="p-img" data-t-alt="cap.photo" hidden>
  <div class="boostrow" id="boostrow">
    <label for="boost" data-t="cap.boost"></label>
    <input type="range" id="boost" min="0" max="100" value="0">
  </div>
  <button class="big green" id="b-release" data-t="cap.release"></button>
  <label class="big ghost" for="file" data-t="cap.retake"></label>
</div>

<!-- готово -->
<div class="screen" id="s-done">
  <div class="bubble">🎉</div>
  <p class="fishname" data-t="cap.done"></p>
  <p class="sub" id="done-sub" data-t="cap.done.sub"></p>
  <label class="big" for="file" data-t="cap.again"></label>
</div>

<!-- ошибка -->
<div class="screen" id="s-error">
  <div class="bubble">🙈</div>
  <div class="err" id="err-text"></div>
  <label class="big" for="file" data-t="cap.retry"></label>
</div>

<script src="/assets/i18n.js"></script>
<script src="/vendor/qr.js"></script>
<script src="/vendor/three.min.js"></script>
<script src="/vendor/GLTFLoader.js"></script>
<!-- до fish-glb.js: он спрашивает у FishFrame оси и голову, иначе половина
     покупных рыб в превью развернётся хвостом вперёд -->
<script src="/assets/fish-frame.js"></script>
<script src="/assets/fish-glb.js"></script>
<script src="/assets/capture.js"></script>
<script src="/assets/tank.js"></script>
<script>
(function () {
  'use strict';

  // Снимать не в какой-то абстрактный аквариум, а в конкретный: адрес
  // страницы /t/<id>/capture говорит, в чей именно уплывёт рыбка.
  if (!Tank.id) { location.replace('/'); return; }

  document.getElementById('back').href = Tank.url;

  // Страница открыта внутри меню аквариума — убираем всё, что там повторяется.
  var EMBED = new URLSearchParams(location.search).has('embed');
  if (EMBED) document.body.classList.add('embed');

  // На устройстве без тача «Сфотографировать лист» открывает выбор файла —
  // тупик: камера у человека в кармане. Показываем мост: QR прямо на эту
  // страницу, телефон наводится и снимает там.
  if (!matchMedia('(pointer: coarse)').matches && window.qrcode) {
    try {
      var qr = qrcode(0, 'M');
      qr.addData(location.origin + Tank.url + '/capture');
      qr.make();
      document.getElementById('cap-qr').innerHTML = qr.createSvgTag(4, 0);
      document.getElementById('qrrow').hidden = false;
    } catch (e) { /* без QR кнопка выбора файла всё равно работает */ }
  }

  var inFrame = EMBED && window.parent !== window;

  function tell(msg) {
    if (!inFrame) return;
    try { window.parent.postMessage(msg, location.origin); } catch (e) { /* не критично */ }
  }

  // Аквариум за окном показывает рыбку сразу, не дожидаясь своего опроса.
  function tellTank() { tell({ aqua: 'fish-added' }); }

  // Экраны съёмки разной высоты — от кнопки до превью с 3D. Врезка не умеет
  // подстраиваться сама, поэтому свою высоту она сообщает наружу.
  // Открытое окно подтверждения бывает выше содержимого страницы — тогда
  // врезке нужна его высота, иначе окно срежется по краям.
  function frameHeight() {
    return Math.max(document.body.scrollHeight,
      (window.Modal && Modal.height && Modal.height()) || 0);
  }

  function tellHeight() { tell({ aqua: 'height', height: frameHeight() }); }

  if (inFrame) {
    if (window.ResizeObserver) new ResizeObserver(tellHeight).observe(document.body);
    addEventListener('load', tellHeight);
    tellHeight();

    // Аквариум не «на большом экране», а прямо за этим окном.
    var doneSub = document.getElementById('done-sub');
    doneSub.setAttribute('data-t', 'cap.done.sub.embed');
    doneSub.textContent = I18N.t('cap.done.sub.embed');

    // Меню открывает съёмку заново — начинать надо с камеры, а не с того
    // экрана, на котором ушли. Врезка живёт между открытиями, сама она
    // об этом не узнает, поэтому её будят снаружи.
    addEventListener('message', function (e) {
      if (e.origin !== location.origin || !e.data) return;
      if (e.data.aqua === 'reset') {
        result = null;
        show('s-start');
        tellHeight();
      }
    });
  }

  var manifest = null;
  var result = null;

  // ── 3D-предпросмотр: рыбка с раскраской ребёнка виляет хвостом ───────────
  var P3 = { ready: false, renderer: null, scene: null, camera: null, mesh: null, geos: {}, raf: 0, stageW: -1, stageH: -1 };

  function init3D() {
    if (P3.ready) return true;
    if (!window.THREE || !window.FishGLB) return false;
    try {
      P3.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    } catch (e) { return false; }
    P3.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    P3.renderer.outputEncoding = THREE.sRGBEncoding;
    document.getElementById('stage3d').appendChild(P3.renderer.domElement);
    P3.scene = new THREE.Scene();
    P3.camera = new THREE.PerspectiveCamera(42, 4 / 3, 0.1, 50);
    P3.camera.position.set(0, 0.4, 3.1);
    P3.camera.lookAt(0, 0, 0);
    P3.scene.add(new THREE.HemisphereLight(0xbfe4ff, 0x1a3550, 0.95));
    var dir = new THREE.DirectionalLight(0xffffff, 1.1);
    dir.position.set(2, 4, 3);
    P3.scene.add(dir);
    P3.ready = true;
    return true;
  }

  // ── модель вида: один загрузчик на экран рисования и на 3D-превью ────────
  // spec.view — 'front' (робот: лист и рисунок с лица, оси модели +Y вверх,
  // +Z к зрителю) или 'side' (рыба: боковой силуэт). Берётся из манифеста.
  var models = {};   // kind → spec | 'loading' | null (не загрузилась)
  function withModel(kind, cb) {
    var m = models[kind];
    if (m === null) return cb(null);
    if (m === 'loading') { setTimeout(function () { withModel(kind, cb); }, 120); return; }
    if (m) return cb(m);
    var fish = null;
    manifest.fish.forEach(function (f) { if (f.name === kind) fish = f; });
    if (!fish || !window.FishGLB) return cb(null);
    models[kind] = 'loading';
    var spec = { url: fish.model, length: 2.4, view: fish.view || 'side' };
    FishGLB.load([spec], function () {
      models[kind] = spec.gltf ? spec : null;
      cb(models[kind]);
    });
  }

  // Геометрия вида с планарной UV — той же плоскостью, в которой ребёнок
  // раскрашивал: с лица у робота, сбоку у рыбы (см. FishGLB.bake). Кэш по виду.
  function fishGeo(kind, cb) {
    if (P3.geos[kind]) return cb(P3.geos[kind]);
    withModel(kind, function (spec) {
      if (!spec) return cb(null);
      var geo = FishGLB.bake(spec, { uv: spec.view === 'front' ? 'front' : 'side' });
      var bb = geo.boundingBox;
      geo.userData.range = [bb.min.z, bb.max.z];
      geo.userData.view = spec.view;
      geo.userData.quat = spec.info.quat;
      P3.geos[kind] = geo;
      cb(geo);
    });
  }

  function show3D(kind) {
    var flat = document.getElementById('p-img');
    var spin = document.getElementById('spin3d');
    spin.style.display = '';
    function fallback() {
      document.getElementById('stage3d').style.display = 'none';
      flat.hidden = false;
      flat.src = result.preview || result.boost.pvCanvas.toDataURL('image/png');
    }
    if (!init3D()) return fallback();
    fishGeo(kind, function (geo) {
      if (!geo) return fallback();
      if (P3.mesh) {
        P3.scene.remove(P3.mesh);
        var oldMesh = P3.mesh.children[0];
        if (oldMesh.material.map) oldMesh.material.map.dispose();
        oldMesh.material.dispose();
      }
      // Текстура прямо из канваса, а не через dataURL: ползунок «Ярче цвета»
      // перерисовывает канвас, и рыбке хватает needsUpdate — без PNG.
      var tex = new THREE.CanvasTexture(result.boost.texCanvas);
      tex.encoding = THREE.sRGBEncoding;
      var mat = new THREE.MeshStandardMaterial({
        map: tex, roughness: 0.5, metalness: 0.05, side: THREE.DoubleSide
      });
      var mesh = new THREE.Mesh(geo, mat);
      var holder = new THREE.Group();
      holder.add(mesh);
      if (geo.userData.view === 'front') {
        // Робот стоит и смотрит в камеру, как на листе: так сразу видно,
        // что лицо легло куда надо. Возвращаем модели её собственные оси.
        mesh.quaternion.copy(geo.userData.quat).invert();
        holder.userData.front = true;
      } else {
        FishGLB.addBend(mat, {
          bodyMask: new THREE.Vector3(0, 0, 1),
          latMask: new THREE.Vector3(1, 0, 0),
          range: geo.userData.range,
          headAtMax: true
        }, 0.4, Math.random() * 6.28);
      }
      P3.mesh = holder;
      P3.scene.add(holder);
      spin.style.display = 'none';
      startLoop();
    });
  }

  function startLoop() {
    cancelAnimationFrame(P3.raf);
    var t0 = performance.now();
    function frame(now) {
      P3.raf = requestAnimationFrame(frame);
      var box = document.getElementById('stage3d');
      if (!box.offsetParent) return;   // экран превью скрыт
      var w = box.clientWidth, h = box.clientHeight;
      if (P3.stageW !== w || P3.stageH !== h) {
        P3.stageW = w; P3.stageH = h;
        P3.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        P3.renderer.setSize(w, h, false);
        P3.camera.aspect = w / h;
        P3.camera.updateProjectionMatrix();
      }
      var t = (now - t0) / 1000;
      FishGLB.uTime.value = t;
      if (P3.mesh) {
        if (P3.mesh.userData.front) {
          // лицом к зрителю, с лёгким поворотом туда-сюда
          P3.mesh.rotation.y = Math.sin(t * 0.5) * 0.7;
          P3.mesh.position.y = Math.sin(t * 0.9) * 0.05;
        } else {
          // боком к зрителю, с лёгким поворотом туда-сюда
          P3.mesh.rotation.y = Math.PI / 2 + Math.sin(t * 0.5) * 0.55;
          P3.mesh.position.y = Math.sin(t * 0.9) * 0.07;
        }
      }
      P3.renderer.render(P3.scene, P3.camera);
    }
    P3.raf = requestAnimationFrame(frame);
  }

  function show(id) {
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('on'); });
    document.getElementById(id).classList.add('on');
  }

  fetch('/assets/coloring/manifest.json')
    .then(function (r) { return r.json(); })
    .then(function (m) { manifest = m; })
    .catch(function () {
      show('s-error');
      document.getElementById('err-text').textContent = I18N.t('cap.err.manifest');
    });

  // EXIF-поворот телефонных фото разруливает createImageBitmap
  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: 'from-image' })
        .catch(function () { return createImageBitmap(file); });
    }
    return new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  window.handlePhoto = function (source) {   // отдельно — для автотестов
    show('s-busy');
    return FishCapture.processPhoto(source, manifest).then(function (r) {
      result = r;
      document.getElementById('p-name').textContent =
        I18N.t('cap.itis', { name: (r.titles && (r.titles[I18N.lang] || r.titles.ru)) || r.title });
      // ползунок стартует с авто-положения: бледный рисунок уже подкручен
      document.getElementById('boost').value = Math.round(r.boost.auto * 100);
      document.getElementById('boostrow').hidden = false;
      show('s-preview');
      show3D(r.kind);
      return r;
    }, function (err) {
      document.getElementById('err-text').textContent = String(err.message || err);
      show('s-error');
      throw err;
    });
  };

  // Живая подстройка: пиксели пересчитываются из сырой копии, 3D-текстура
  // обновляется через needsUpdate. Во время протяжки события схлопывает
  // rAF-затвор, но rAF — только оптимизация: в перекрытой вкладке Chrome
  // его замораживает, поэтому отпускание ползунка ('change') и отправка
  // применяют значение синхронно, иначе рыбка уплывёт неподкрученной.
  var boostEl = document.getElementById('boost');
  var boostQueued = false;
  function applyBoost() {
    boostQueued = false;
    if (!result || !result.boost) return;
    var v = boostEl.value / 100;
    if (result.boost.value === v) return;
    result.boost.set(v);
    if (P3.mesh && P3.mesh.material.map) P3.mesh.material.map.needsUpdate = true;
    var flat = document.getElementById('p-img');
    if (!flat.hidden) flat.src = result.boost.pvCanvas.toDataURL('image/png');
  }
  boostEl.addEventListener('input', function () {
    if (!boostQueued) { boostQueued = true; requestAnimationFrame(applyBoost); }
  });
  boostEl.addEventListener('change', applyBoost);

  document.getElementById('file').addEventListener('change', function () {
    var file = this.files && this.files[0];
    this.value = '';
    if (!file || !manifest) return;
    show('s-busy');
    loadBitmap(file).then(window.handlePhoto, function () {
      document.getElementById('err-text').textContent = I18N.t('cap.err.photo');
      show('s-error');
    });
  });

  window.releaseFish = function () {         // отдельно — для автотестов
    if (!result) return Promise.reject(new Error(I18N.t('cap.err.nofish')));
    applyBoost();   // страховка: rAF мог не успеть — уходит то, что на ползунке
    document.getElementById('busy-text').textContent = I18N.t('cap.sending');
    show('s-busy');
    return fetch(Tank.api + '/fish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // текстура запекается с текущим положением ползунка — в аквариум
      // уплывает то, что человек видел на превью
      body: JSON.stringify({
        kind: result.kind,
        texture: result.boost ? result.boost.bake().texture : result.texture
      })
    }).then(function (r) {
      if (!r.ok) throw new Error(I18N.t('cap.err.status', { code: r.status }));
      return r.json();
    }).then(function (r) {
      show('s-done');
      tellTank();
      return r;
    }, function (err) {
      document.getElementById('err-text').textContent = I18N.t('cap.err.send', { msg: err.message || err });
      show('s-error');
      throw err;
    });
  };

  document.getElementById('b-release').addEventListener('click', function () { window.releaseFish(); });

  // ── рисование ───────────────────────────────────────────────────────────────
  // Холст — робот с лица, каким он есть в аквариуме (заводская текстура без
  // света). Ребёнок красит поверх: слой мазков лежит над подложкой и режется
  // по её силуэту. Ластик стирает мазки — под ними снова робот, «Как было»
  // убирает всё. В текстуру уходит подложка + мазки той же плоскостью,
  // которой FishGLB.bake({uv:'front'}) кладёт её на модель.
  var DRAW_COLORS = ['#e53e3e','#dd6b20','#d69e2e','#38a169','#3182ce',
                     '#805ad5','#d53f8c','#2d3748','#aaaaaa','#ffffff'];
  var DRAW_W = 512;   // px текстуры по горизонтали; высота — по габариту
  var Draw = {
    canvas: document.getElementById('draw-canvas'),
    ctx: null, fish: null,
    base: null, strokes: null, sctx: null,
    color: '#e53e3e', size: 18, erasing: false,
    lastX: 0, lastY: 0, down: false
  };
  if (Draw.canvas) Draw.ctx = Draw.canvas.getContext('2d');

  function makeCanvas(w, h) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  // Подложка из модели: ортографический рендер с +Z без света, фон прозрачный —
  // прозрачность и есть силуэт. Без WebGL — белый силуэт по контуру с листа.
  function drawBase(fish, spec) {
    var bz = fish.bboxModel.z, by = fish.bboxModel.y;
    var W = DRAW_W, H = Math.round(W * (by[1] - by[0]) / (bz[1] - bz[0]));
    var base = makeCanvas(W, H);
    var bctx = base.getContext('2d');

    if (spec && init3D()) {
      var root = spec.gltf.scene;
      root.updateWorldMatrix(true, true);
      var box = new THREE.Box3().setFromObject(root);
      var swapped = [];
      root.traverse(function (o) {
        if (!o.isMesh) return;
        var m = Array.isArray(o.material) ? o.material[0] : o.material;
        swapped.push({ mesh: o, material: o.material });
        o.material = new THREE.MeshBasicMaterial({ map: m.map || null, color: m.color || 0xffffff });
      });
      var scene = new THREE.Scene();
      scene.add(root);
      var cam = new THREE.OrthographicCamera(box.min.x, box.max.x, box.max.y, box.min.y, 0.01, 100);
      cam.position.set(0, 0, box.max.z + 1);
      cam.lookAt(0, 0, 0);
      var r = P3.renderer;
      r.setPixelRatio(1);
      r.setSize(W, H, false);
      r.setClearColor(0x000000, 0);
      r.render(scene, cam);
      bctx.drawImage(r.domElement, 0, 0);
      P3.stageW = -1;   // цикл превью вернёт свой размер
      scene.remove(root);
      swapped.forEach(function (sw) { sw.mesh.material.dispose(); sw.mesh.material = sw.material; });
    } else {
      bctx.beginPath();
      fish.contourModel.forEach(function (pt, i) {
        var x = (pt[0] - bz[0]) / (bz[1] - bz[0]) * W;
        var y = (by[1] - pt[1]) / (by[1] - by[0]) * H;
        if (i === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
      });
      bctx.closePath();
      bctx.fillStyle = '#ffffff';
      bctx.fill();
    }
    return base;
  }

  // Что видит ребёнок: подложка, поверх — мазки в пределах силуэта, под всем — тёмный фон.
  function drawCompose() {
    var ctx = Draw.ctx, c = Draw.canvas;
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.drawImage(Draw.base, 0, 0);
    ctx.globalCompositeOperation = 'source-atop';
    ctx.drawImage(Draw.strokes, 0, 0);
    ctx.globalCompositeOperation = 'destination-over';
    ctx.fillStyle = '#0a2233';
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.globalCompositeOperation = 'source-over';
  }

  // Текстура: то же без фона. Край силуэта растягиваем наружу — планарная
  // UV у самой кромки подсасывает соседние тексели, и без этого по контуру
  // робота шла бы тёмная кайма.
  function drawTexture() {
    var W = Draw.base.width, H = Draw.base.height;
    var inner = makeCanvas(W, H), ictx = inner.getContext('2d');
    ictx.drawImage(Draw.base, 0, 0);
    ictx.globalCompositeOperation = 'source-atop';
    ictx.drawImage(Draw.strokes, 0, 0);

    var out = makeCanvas(W, H), octx = out.getContext('2d');
    octx.drawImage(inner, 0, 0);
    octx.globalCompositeOperation = 'destination-over';
    [2, 4, 7, 11, 16].forEach(function (rad) {
      for (var a = 0; a < 8; a++) {
        octx.drawImage(inner, Math.round(Math.cos(a * Math.PI / 4) * rad), Math.round(Math.sin(a * Math.PI / 4) * rad));
      }
    });
    octx.fillStyle = '#c9c9c9';
    octx.fillRect(0, 0, W, H);
    octx.globalCompositeOperation = 'source-over';
    return out;
  }

  function drawStroke(x1, y1, x2, y2) {
    if (!Draw.strokes) return;
    var ctx = Draw.sctx;
    ctx.globalCompositeOperation = Draw.erasing ? 'destination-out' : 'source-over';
    ctx.strokeStyle = ctx.fillStyle = Draw.color;
    if (x1 === x2 && y1 === y2) {
      ctx.beginPath(); ctx.arc(x1, y1, Draw.size / 2, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = Draw.size; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
    }
    drawCompose();
  }

  function drawFill() {
    if (!Draw.strokes) return;
    Draw.sctx.globalCompositeOperation = 'source-over';
    Draw.sctx.fillStyle = Draw.color;
    Draw.sctx.fillRect(0, 0, Draw.strokes.width, Draw.strokes.height);
    drawCompose();
  }

  function drawReset() {
    if (!Draw.strokes) return;
    Draw.sctx.clearRect(0, 0, Draw.strokes.width, Draw.strokes.height);
    drawCompose();
  }

  function drawPos(e) {
    var rect = Draw.canvas.getBoundingClientRect();
    var scX = Draw.canvas.width / rect.width, scY = Draw.canvas.height / rect.height;
    return [(e.clientX - rect.left) * scX, (e.clientY - rect.top) * scY];
  }

  if (Draw.canvas) {
    Draw.canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault(); Draw.down = true;
      if (Draw.canvas.setPointerCapture) { try { Draw.canvas.setPointerCapture(e.pointerId); } catch (err) { /* не критично */ } }
      var p = drawPos(e); Draw.lastX = p[0]; Draw.lastY = p[1];
      drawStroke(p[0], p[1], p[0], p[1]);
    });
    Draw.canvas.addEventListener('pointermove', function (e) {
      if (!Draw.down) return; e.preventDefault();
      var p = drawPos(e); drawStroke(Draw.lastX, Draw.lastY, p[0], p[1]);
      Draw.lastX = p[0]; Draw.lastY = p[1];
    });
    ['pointerup', 'pointercancel'].forEach(function (ev) {
      Draw.canvas.addEventListener(ev, function () { Draw.down = false; });
    });
  }

  function setEraser(on) {
    Draw.erasing = on;
    document.getElementById('erase-btn').classList.toggle('active', on);
    if (on) document.querySelectorAll('.swatch').forEach(function (sw) { sw.classList.remove('active'); });
  }

  function initDrawScreen() {
    if (!manifest || !manifest.fish || !manifest.fish[0]) return;
    var fish = manifest.fish[0];
    Draw.fish = fish;
    document.getElementById('draw-name').textContent =
      I18N.t('cap.itis', { name: (fish.titles && (fish.titles[I18N.lang] || fish.titles.ru)) || fish.title });

    var pal = document.getElementById('palette');
    if (!pal.children.length) {
      DRAW_COLORS.forEach(function (c, idx) {
        var btn = document.createElement('button');
        btn.className = 'swatch' + (idx === 0 ? ' active' : '');
        btn.style.background = c;
        if (c === '#ffffff') btn.style.border = '2px solid #888';
        btn.addEventListener('click', function () {
          document.querySelectorAll('.swatch').forEach(function (sw) { sw.classList.remove('active'); });
          btn.classList.add('active');
          Draw.color = c;
          setEraser(false);
        });
        pal.appendChild(btn);
      });
    } else {
      document.querySelectorAll('.swatch').forEach(function (sw, i) { sw.classList.toggle('active', i === 0); });
      Draw.color = DRAW_COLORS[0];
    }
    setEraser(false);

    show('s-busy');
    document.getElementById('busy-text').textContent = I18N.t('cap.reviving');
    withModel(fish.name, function (spec) {
      Draw.base = drawBase(fish, spec);
      Draw.canvas.width = Draw.base.width; Draw.canvas.height = Draw.base.height;
      Draw.strokes = makeCanvas(Draw.base.width, Draw.base.height);
      Draw.sctx = Draw.strokes.getContext('2d');
      drawCompose();
      show('s-draw');
      tellHeight();
    });
  }

  document.getElementById('erase-btn').addEventListener('click', function () { setEraser(!Draw.erasing); });
  document.getElementById('fill-btn').addEventListener('click', function () { setEraser(false); drawFill(); });
  document.getElementById('clear-btn').addEventListener('click', drawReset);
  document.getElementById('brush-size').addEventListener('input', function () { Draw.size = +this.value; });
  document.getElementById('b-draw-back').addEventListener('click', function () { show('s-start'); tellHeight(); });

  window.finishDrawing = function () {   // отдельно — для автотестов
    var fish = Draw.fish; if (!fish || !Draw.base) return;
    var tex = drawTexture();
    result = {
      kind: fish.name, titles: fish.titles, title: fish.title,
      boost: {
        texCanvas: tex, pvCanvas: tex,
        auto: 0, value: 0,
        set: function () {},
        bake: function () { return { texture: tex.toDataURL('image/png') }; }
      }
    };
    document.getElementById('p-name').textContent =
      I18N.t('cap.itis', { name: (fish.titles && (fish.titles[I18N.lang] || fish.titles.ru)) || fish.title });
    document.getElementById('boostrow').hidden = true;   // нечего подкручивать: цвета уже сочные
    show('s-preview');
    show3D(fish.name);
    return result;
  };
  document.getElementById('b-draw-done').addEventListener('click', window.finishDrawing);

  document.getElementById('b-draw').addEventListener('click', function () {
    if (!manifest) return;
    initDrawScreen();
  });
})();
</script>
</body>
</html>
